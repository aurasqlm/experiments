<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Experiments — Video &amp; Real-Time 3D Showcase</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: #06070A;
    color: #F5F7FA;
    font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid rgba(200, 206, 214, 0.14);
    padding-bottom: 20px;
    margin-bottom: 42px;
  }
  h1 {
    font-size: clamp(18px, 2.2vw, 26px);
    font-weight: 300;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }
  .sub {
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #9CA6B4;
  }
  .card {
    background: linear-gradient(180deg, rgba(16, 19, 27, 0.9) 0%, rgba(9, 11, 16, 0.96) 100%);
    border: 1px solid rgba(214, 165, 108, 0.22);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
  }
  .video-shell {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #06070A;
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #06070A;
  }
  .meta {
    padding: 24px 28px 28px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .title {
    font-size: clamp(18px, 2.1vw, 24px);
    font-weight: 300;
    letter-spacing: 0.24em;
  }
  .title span {
    color: #D6A56C;
    margin: 0 0.08em;
  }
  .tagline {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.34em;
    color: #A8B2C1;
    text-transform: uppercase;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary {
    background: rgba(214, 165, 108, 0.14);
    border: 1px solid rgba(214, 165, 108, 0.65);
    color: #F5F7FA;
  }
  .btn-primary:hover {
    background: rgba(214, 165, 108, 0.26);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(200, 206, 214, 0.25);
    color: #C8CED6;
  }
  .btn-secondary:hover {
    border-color: rgba(245, 247, 250, 0.55);
    color: #F5F7FA;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Experiments</h1>
      <div class="sub">1080p 30fps Renders &amp; Real-Time 3D</div>
    </header>

    <article class="card">
      <div class="video-shell">
        <video controls playsinline preload="metadata" src="./Video/chrono-01-1080p-30fps.mp4"></video>
      </div>
      <div class="meta">
        <div>
          <div class="title">CHRONO<span>//</span>01</div>
          <div class="tagline">Engineered in Time · 1920×1080 · 30fps · Pure-Code 3D</div>
        </div>
        <div class="actions">
          <a class="btn btn-primary" href="./chrono-01/">Launch Interactive 3D</a>
          <a class="btn btn-secondary" href="./Video/chrono-01-1080p-30fps.mp4" download>Download 1080p MP4</a>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
